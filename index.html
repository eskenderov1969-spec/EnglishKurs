<script>
var IT=300000;
async function unlock(code){var b=Uint8Array.from(atob(document.getElementById('p').textContent.trim()),function(c){return c.charCodeAt(0)}),salt=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28);
var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct))}
function open_(h){document.open();document.write(h);document.close()}
async function go(code,remember,auto){var m=document.getElementById('m'),btn=document.getElementById('b');m.textContent='';btn.disabled=true;btn.textContent='Проверяю…';
try{var h=await unlock(code.trim());if(remember){try{localStorage.setItem('acc',code.trim())}catch(e){}}open_(h)}
catch(e){btn.disabled=false;btn.textContent='Войти';if(auto){try{localStorage.removeItem('acc')}catch(x){}}else{m.textContent='Неверный код';var bx=document.getElementById('box');bx.classList.remove('sh');void bx.offsetWidth;bx.classList.add('sh')}}}
document.getElementById('b').onclick=function(){go(document.getElementById('k').value,document.getElementById('r').checked,false)};
document.getElementById('k').onkeydown=function(e){if(e.key==='Enter')document.getElementById('b').click()};
try{var s=localStorage.getItem('acc');if(s)go(s,true,true)}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script></body></html>
