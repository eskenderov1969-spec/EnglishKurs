@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1c212d;--tx:#e8ebf3;--mu:#98a1b6;--ac:#7b92ff;--ok:#43c18a;--bad:#ef6b6b;--bd:#2b3242;--wa:#3a3320}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1c212d;--tx:#e8ebf3;--mu:#98a1b6;--ac:#7b92ff;--ok:#43c18a;--bad:#ef6b6b;--bd:#2b3242;--wa:#3a3320}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 10px}h2{font-size:17px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.full{width:100%}
button:disabled{opacity:.9}
.mu{color:var(--mu);font-size:14px}.w{font-size:20px;font-weight:600}.c{text-align:center}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:13px 14px}
.ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
.bad{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
.sel{outline:2px solid var(--ac)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 12px}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.big{font-size:40px;text-align:center;margin:8px 0}
.flip{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:30px;font-weight:700}
.fb{padding:12px;border-radius:12px;margin:8px 0;font-weight:600}.fb.ok{background:var(--ok)}.fb.bad{background:var(--bad)}
.ban{background:var(--wa);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.st{flex:1;text-align:center}.st b{display:block;font-size:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
body{background:radial-gradient(800px 420px at 100% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(700px 420px at -10% 0,rgba(0,190,220,.18),transparent 60%),var(--bg);background-attachment:fixed}
main{padding:18px 16px 40px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#7c5cff,#00b4d8);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.card{border-radius:20px;box-shadow:0 8px 24px rgba(40,50,110,.09);animation:pop .28s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button{border-radius:14px;font-weight:600;transition:transform .12s}
button:active{transform:scale(.97)}
button.p{background:linear-gradient(135deg,#7c5cff,#4f6df5 55%,#00b4d8);border:0;color:#fff;box-shadow:0 8px 20px rgba(100,100,255,.35)}
.bar{height:12px;border-radius:8px}.bar i{background:linear-gradient(90deg,#7c5cff,#00b4d8);border-radius:8px}
.hero{background:linear-gradient(135deg,#7c5cff,#4f6df5 55%,#00b4d8);border:0;color:#fff}
.hero .mu{color:rgba(255,255,255,.85)}.hero .bar{background:rgba(255,255,255,.3)}.hero .bar i{background:#fff}
.hero button.p{background:#fff;color:#4a43c9;box-shadow:none}
.flip{background:linear-gradient(160deg,var(--card),rgba(124,92,255,.16));min-height:240px;font-size:34px}
.opt{border-radius:16px;font-weight:600;box-shadow:0 3px 10px rgba(40,50,110,.06)}
.st b{font-size:22px}
.gx b{color:var(--ac)}.gx .ex{background:rgba(124,92,255,.12);border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:600}
textarea{font:13px/1.3 monospace;width:100%;min-height:90px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:10px}
</style>
